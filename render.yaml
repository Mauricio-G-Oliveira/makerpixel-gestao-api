services:
  # ==============================================================================
  # 1. API Principal Central Contábil (Spring Boot 3 + Java 21)
  # ==============================================================================
  - type: web
    name: central-contabil-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:postgresql://db.<supabase-id>.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CENTRAL_MASTER_KEY
        sync: false # Chave AES-256 de 32 bytes em Base64 para cifrar o cofre de certificados e credenciais SIEG
      - key: JWT_SECRET
        sync: false # Segredo para assinatura de tokens JWT
      - key: NOTASYNC_CRON_SECRET
        sync: false # Segredo compartilhado para chamadas dos cron jobs internos
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.makerpixeltech.com.br,https://makerpixeltech.com.br,https://www.makerpixeltech.com.br
      - key: RTC_CALCULADORA_URL
        value: http://central-contabil-calculadora-rtc:8088
      - key: TZ
        value: America/Sao_Paulo

  # ==============================================================================
  # 2. Motor Oficial da Reforma Tributária (Calculadora RTC - Receita Federal)
  # Serviço Privado: isolado da internet pública, comunicando apenas com a API.
  # ==============================================================================
  - type: pserv
    name: central-contabil-calculadora-rtc
    runtime: docker
    dockerfilePath: ./infra/calculadora-rtc/Dockerfile
    plan: standard
    region: ohio
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: offline
      - key: SERVER_PORT
        value: 8088
      - key: TZ
        value: America/Sao_Paulo

  # ==============================================================================
  # 3. Pipeline Agendado de Auditoria Contínua (Render Cron Jobs)
  # Ordem estrita de execução com advisory lock no PostgreSQL:
  # NotaSync (04:00) -> SIEG (04:30) -> Auditoria Contínua (05:00) -> Em Dia (06:00)
  # ==============================================================================

  # Etapa 1: NotaSync Nuvem (Coleta SEF/SC - NFC-e modelo 65)
  - type: cron
    name: 01-notasync-cron-coletor
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "0 4 * * *" # Diariamente às 04:00 (America/Sao_Paulo)
    envVars:
      - key: API_URL
        value: https://central-contabil-api.onrender.com
      - key: NOTASYNC_CRON_SECRET
        sync: false
    startCommand: "curl -fsS -X POST \"$API_URL/interno/notasync/rodar\" -H \"X-Notasync-Cron-Secret: $NOTASYNC_CRON_SECRET\""

  # Etapa 2: SIEG Nuvem (Coleta NF-e modelo 55 e CT-e modelo 57)
  - type: cron
    name: 02-sieg-cron-coletor
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "30 4 * * *" # Diariamente às 04:30 (America/Sao_Paulo)
    envVars:
      - key: API_URL
        value: https://central-contabil-api.onrender.com
      - key: NOTASYNC_CRON_SECRET
        sync: false
    startCommand: "curl -fsS -X POST \"$API_URL/interno/sieg/rodar\" -H \"X-Notasync-Cron-Secret: $NOTASYNC_CRON_SECRET\""

  # Etapa 3: Auditoria Contínua IBS/CBS (Processamento da fila auditoria_pendente)
  - type: cron
    name: 03-reforma-cron-auditoria-continua
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "0 5 * * *" # Diariamente às 05:00 (America/Sao_Paulo)
    envVars:
      - key: API_URL
        value: https://central-contabil-api.onrender.com
      - key: NOTASYNC_CRON_SECRET
        sync: false
    startCommand: "curl -fsS -X POST \"$API_URL/interno/reforma/processar-pendentes\" -H \"X-Notasync-Cron-Secret: $NOTASYNC_CRON_SECRET\""

  # Etapa 4: Em Dia (Geração/Atualização de tarefas e obrigações fiscais)
  - type: cron
    name: 04-emdia-cron-gerador
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "0 6 * * *" # Diariamente às 06:00 (America/Sao_Paulo)
    envVars:
      - key: API_URL
        value: https://central-contabil-api.onrender.com
      - key: NOTASYNC_CRON_SECRET
        sync: false
    startCommand: "curl -fsS -X POST \"$API_URL/interno/emdia/gerar-mes-cron\" -H \"X-Notasync-Cron-Secret: $NOTASYNC_CRON_SECRET\""
