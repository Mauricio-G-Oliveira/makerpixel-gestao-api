services:
  # ==============================================================================
  # 1. API Principal Central Contábil (Spring Boot 3 + Java 21)
  # ==============================================================================
  - type: web
    name: central-contabil-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:postgresql://db.<supabase-id>.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CENTRAL_MASTER_KEY
        sync: false # Chave AES-256 de 32 bytes em Base64 para cifrar o cofre de certificados
      - key: JWT_SECRET
        sync: false # Segredo para assinatura de tokens JWT
      - key: NOTASYNC_CRON_SECRET
        sync: false # Segredo compartilhado para chamadas dos cron jobs internos
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.makerpixeltech.com.br,https://makerpixeltech.com.br,https://www.makerpixeltech.com.br
      - key: RTC_CALCULADORA_URL
        value: http://central-contabil-calculadora-rtc:8088
      - key: TZ
        value: America/Sao_Paulo

  # ==============================================================================
  # 2. Motor Oficial da Reforma Tributária (Calculadora RTC - Receita Federal)
  # Serviço Privado: isolado da internet pública, comunicando apenas com a API.
  # ==============================================================================
  - type: pserv
    name: central-contabil-calculadora-rtc
    runtime: docker
    dockerfilePath: ./infra/calculadora-rtc/Dockerfile
    plan: standard
    region: ohio
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: offline
      - key: SERVER_PORT
        value: 8088
      - key: TZ
        value: America/Sao_Paulo

  # ==============================================================================
  # 3. Cron Job: NotaSync Nuvem (Coletor periódico de documentos fiscais)
  # ==============================================================================
  - type: cron
    name: notasync-cron-coletor
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "0 */2 * * *" # A cada 2 horas
    envVars:
      - key: API_URL
        value: https://central-contabil-api.onrender.com
      - key: NOTASYNC_CRON_SECRET
        sync: false
    startCommand: "curl -fsS -X POST \"$API_URL/interno/notasync/rodar\" -H \"X-Notasync-Cron-Secret: $NOTASYNC_CRON_SECRET\""

  # ==============================================================================
  # 4. Cron Job: Em Dia (Geração mensal automática de obrigações e tarefas)
  # ==============================================================================
  - type: cron
    name: emdia-cron-gerador
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "0 6 1 * *" # Todo dia 1 do mês às 06:00
    envVars:
      - key: API_URL
        value: https://central-contabil-api.onrender.com
      - key: NOTASYNC_CRON_SECRET
        sync: false
    startCommand: "curl -fsS -X POST \"$API_URL/interno/emdia/gerar-mes-cron\" -H \"X-Notasync-Cron-Secret: $NOTASYNC_CRON_SECRET\""
