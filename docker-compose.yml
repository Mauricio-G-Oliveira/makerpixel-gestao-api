services:
  # Banco de dados relacional multi-tenant
  postgres:
    image: postgres:16-alpine
    container_name: central-contabil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: makerpixel_contabil
      POSTGRES_USER: makerpixel
      POSTGRES_PASSWORD: makerpixel_secret
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makerpixel -d makerpixel_contabil"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Calculadora RTC da Receita Federal (Serviço Privado de Cálculo IBS/CBS)
  calculadora-rtc:
    build:
      context: .
      dockerfile: infra/calculadora-rtc/Dockerfile
    container_name: central-contabil-calculadora-rtc
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: offline
      SERVER_PORT: 8088
      TZ: America/Sao_Paulo
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API Central Contábil (Spring Boot 3 + Java 21)
  backend:
    build:
      context: ./makerpixel-gestao-api
      dockerfile: Dockerfile
    container_name: central-contabil-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      calculadora-rtc:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/makerpixel_contabil
      SPRING_DATASOURCE_USERNAME: makerpixel
      SPRING_DATASOURCE_PASSWORD: makerpixel_secret
      JWT_SECRET: makerpixel-secret-token-key-super-secure-at-least-256-bits-length-tubarao-sc
      CENTRAL_MASTER_KEY: bWFrZXJwaXhlbC1tYXN0ZXIta2V5LTMyYnl0ZXM=
      RTC_CALCULADORA_URL: http://calculadora-rtc:8088
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

  # Frontend SPA PWA (React 18 + Vite + Tailwind)
  frontend:
    build:
      context: ./makerpixel-techsystem
      dockerfile: Dockerfile
    container_name: central-contabil-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
