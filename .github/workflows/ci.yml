name: CI API

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makerpixel_contabil
          POSTGRES_USER: makerpixel
          POSTGRES_PASSWORD: makerpixel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Permissão de execução no Maven Wrapper
        run: chmod +x ./mvnw

      - name: Executar testes unitários e de integração
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/makerpixel_contabil
          SPRING_DATASOURCE_USERNAME: makerpixel
          SPRING_DATASOURCE_PASSWORD: makerpixel_test_password
          JWT_SECRET: chave-super-secreta-para-testes-ci-makerpixel-jwt-segura-256bits
        run: ./mvnw -B test
